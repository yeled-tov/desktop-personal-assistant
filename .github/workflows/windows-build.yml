name: Build Windows installer

'on':
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Locate preinstalled Inno Setup
        shell: pwsh
        run: |
          $installRoots = @(
            'C:\Program Files\Inno Setup 7',
            'C:\Program Files (x86)\Inno Setup 7',
            'C:\Program Files\Inno Setup 6',
            'C:\Program Files (x86)\Inno Setup 6'
          )
          $compiler = $installRoots | ForEach-Object { Join-Path $_ 'ISCC.exe' } | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { throw 'The GitHub Windows runner did not provide Inno Setup ISCC.exe.' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $compiler)

      - name: Restore, build, test, and publish
        shell: pwsh
        run: .\scripts\build-release.ps1

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/installer/DesktopAssistant-Portable-Windows-x64.zip -CompressionLevel Optimal

      - name: Publish private GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "desktop-assistant-${{ github.run_number }}"
          gh release create $tag `
            "artifacts/installer/DesktopAssistant-Setup.exe" `
            "artifacts/installer/DesktopAssistant-Portable-Windows-x64.zip" `
            --title "Desktop Assistant Windows build ${{ github.run_number }}" `
            --notes "Windows x64 installer and portable build. Built from commit ${{ github.sha }}." `
            --prerelease
