name: Build Windows installer

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Make sure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress | Out-Null }
          if (Test-Path "${env:ProgramFiles(x86)}\NSIS") { Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS" }

      - name: Build, launch-test (smoke test on real Windows) and package
        shell: pwsh
        run: |
          $version = "2.0.${{ github.run_number }}"
          .\scripts\build-release.ps1 -Version $version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/DesktopAssistant.exe -DestinationPath artifacts/installer/DesktopAssistant-Portable-Windows-x64.zip -CompressionLevel Optimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-${{ env.APP_VERSION }}
          path: artifacts/installer/*

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release create $tag `
            "artifacts/installer/DesktopAssistant-Setup.exe" `
            "artifacts/installer/DesktopAssistant-Portable-Windows-x64.zip" `
            --title "העוזר האישי $env:APP_VERSION" `
            --notes "מתקין ל-Windows 10/11 (x64). הורד את DesktopAssistant-Setup.exe והפעל. נבנה מ-${{ github.sha }} ועבר בדיקת הפעלה אוטומטית על Windows." `
            --latest

  offline-test:
    # Downloads the light offline packs from their real URLs and runs local speech + brain on Windows.
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Run the offline stack test
        shell: pwsh
        run: |
          $zip = Get-ChildItem dl -Recurse -Filter 'DesktopAssistant-Portable-Windows-x64.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app
          $marker = Join-Path $env:LOCALAPPDATA 'DesktopAssistant\offline-result.txt'
          $p = Start-Process -FilePath app\DesktopAssistant.exe -ArgumentList '--smoke-offline' -PassThru
          if (-not $p.WaitForExit(3300000)) { Stop-Process -Id $p.Id -Force }
          $result = if (Test-Path $marker) { Get-Content $marker -Raw } else { '(no result file)' }
          $log = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'DesktopAssistant\logs') -Filter 'app-*.log' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1
          $tail = if ($log) { (Get-Content $log.FullName -Tail 40) -join "`n" } else { '' }
          Write-Host $result; Write-Host $tail
          Write-Host ("::notice title=Offline test::" + ($result -replace "`r","" -replace "`n","%0A"))
          Write-Host ("::notice title=Offline log::" + ($tail -replace "`r","" -replace "`n","%0A"))
          if (-not $result.StartsWith('OFFLINE OK')) { exit 1 }

