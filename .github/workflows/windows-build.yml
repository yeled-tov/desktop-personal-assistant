name: Build Windows installer

'on':
  workflow_dispatch:
  push:
    branches: ['**']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $compiler = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe','C:\Program Files (x86)\Inno Setup 7\ISCC.exe','C:\Program Files\Inno Setup 7\ISCC.exe') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) { choco install innosetup -y --no-progress | Out-Null; $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $compiler)

      - name: Build, launch-test (smoke test on real Windows) and package
        shell: pwsh
        run: |
          $version = "2.0.${{ github.run_number }}"
          .\scripts\build-release.ps1 -Version $version
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/portable/DesktopAssistant.exe -DestinationPath artifacts/installer/DesktopAssistant-Portable-Windows-x64.zip -CompressionLevel Optimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DesktopAssistant-${{ env.APP_VERSION }}
          path: artifacts/installer/*

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release create $tag `
            "artifacts/installer/DesktopAssistant-Setup.exe" `
            "artifacts/installer/DesktopAssistant-Portable-Windows-x64.zip" `
            --title "העוזר האישי $env:APP_VERSION" `
            --notes "מתקין ל-Windows 10/11 (x64). הורד את DesktopAssistant-Setup.exe והפעל. נבנה מ-${{ github.sha }} ועבר בדיקת הפעלה אוטומטית על Windows." `
            --latest
