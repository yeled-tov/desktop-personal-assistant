name: Dev packs
'on':
  push:
    branches: [diag/startup]
permissions:
  contents: write
jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download packs
        run: |
          mkdir -p dl && cd dl
          cat > p.csproj <<'X'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net10.0</TargetFramework><NuGetAudit>false</NuGetAudit></PropertyGroup>
            <ItemGroup>
              <PackageDownload Include="Microsoft.WindowsDesktop.App.Ref" Version="[10.0.12]" />
              <PackageDownload Include="Microsoft.NETCore.App.Host.win-x64" Version="[10.0.12]" />
              <PackageDownload Include="Microsoft.Windows.SDK.NET.Ref" Version="[10.0.19041.57]" />
            </ItemGroup>
          </Project>
          X
          dotnet restore p.csproj --packages ../pk
          cd ..
          tar czf devpacks.tgz -C pk microsoft.windowsdesktop.app.ref microsoft.netcore.app.host.win-x64 microsoft.windows.sdk.net.ref
          ls -la devpacks.tgz
          split -b 45m devpacks.tgz devpacks.part.
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan devpacks
          git rm -rfq --cached .
          git add devpacks.part.*
          git commit -qm devpacks
          git push -f origin devpacks
