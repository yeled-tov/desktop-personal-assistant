name: Probe download URLs
'on':
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
          for r in ggml-org/llama.cpp ggml-org/whisper.cpp; do
            echo "== $r releases"; gh api "repos/$r/releases?per_page=6" --jq '.[] | "TAG " + .tag_name + " prerelease=" + (.prerelease|tostring) + " assets=" + (.assets|length|tostring) + "\n" + ([.assets[] | select(.name|test("win|x64|bin";"i")) | "   " + .name + " " + (.size|tostring)] | join("\n"))'
          done
          url=$(gh api "repos/ggml-org/whisper.cpp/releases?per_page=10" --jq '[.[] | .assets[] | select(.name=="whisper-bin-x64.zip")][0].browser_download_url'); echo "whisper url: $url"; curl -sL -o w.zip "$url" && unzip -l w.zip | head -40
          url=$(gh api "repos/ggml-org/llama.cpp/releases?per_page=10" --jq '[.[] | .assets[] | select(.name|test("bin-win-cpu-x64.zip$"))][0].browser_download_url'); echo "llama url: $url"; curl -sL -o l.zip "$url" && unzip -l l.zip | head -70
          } > probe.txt 2>&1
          git config user.name ci; git config user.email ci@example.com
          git add probe.txt; git commit -qm "probe [skip ci]"; git push
